<!-- spotinfo_widget.html (your web asset, NOT in Flutter package) -->
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spotinfo Widget</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }

        spotinfo-chat {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <script>
        window.spotinfoConfigFromFlutter = window.spotinfoConfigFromFlutter || {};

        function applyConfigToWidget(widgetElement, config) {
            const finalConfig = {
                'api-key': '<test api key>',
                'user-id': '<user-id>',

                // widget does not updated value of api keys and thus we pass <your api key> is uncommented. Same for user-id



                // 'client-id': 'client 1',

                // Core
                'user-journey': false,
                'allow-voice': true,
                'use-whatsapp': false,
                'whatsapp-greeting': "Let's continue our interaction here.",
                'use-telephony': false,
                'auto-initiate': false,
                'auto-initiate-time': 5,

                // Colors & Typography
                'primary-color': '#3641db',
                'secondary-color': '#E9E6FF',
                'message-text-color': '#000000',
                'button-content-color': '#ffffff',
                'font-family': 'Inter',
                'message-font-size': '14px',
                'bot-name': 'Revy',

                // Launcher Button
                'root-button-height': '48px',
                'root-button-width': '48px',
                'root-button-shape': 'circular-pill',
                'root-button-shape-mobile': 'circular',
                'root-button-logo': 'https://spotinfo.ai/public_images/Spotinfo-White.png',
                'root-logo-height': '40px',
                'root-logo-width': '40px',
                'root-border-color': '#3641db',
                'root-text-color': '#3641db',
                'desktop-x-offset': '20px',
                'desktop-y-offset': '20px',
                'mobile-x-offset': '4vw',
                'mobile-y-offset': '8vh',
                'root-title': 'Ask Revy',
                'root-subtitle': 'Online · replies in 10s',

                // Main Widget
                'view-type': 'modern_view',
                'width': '400px',
                'height': '600px',
                'placeholder': 'Type your question here...',
                'header-logo': 'https://spotinfo.ai/public_images/Spotinfo-White.png',
                'show-timestamp': true,
                'show-date-separator': true,
                'show-avatars': true,
                'ai-avatar': 'https://spotinfo.ai/public_images/Spotinfo-White.png',
                'footer-text': 'Powered by SpotInfo',

                // Popup
                'popup-type': 'modern',
                'show-popup-primary-btn': false,

                // Debug / Misc
                'show-client-id': true,

                // Merchant config overrides defaults
                ...config,
            };

            const setAttr = (attrName, value) => {
                if (value !== undefined && value !== null) {
                    widgetElement.setAttribute(
                        attrName,
                        typeof value === 'boolean' ? String(value) : value
                    );
                }
            };

            Object.entries(finalConfig).forEach(([key, value]) => {
                if (key !== 'proactive-engagement') {
                    setAttr(key, value);
                }
            });

            if (finalConfig['proactive-engagement']) {
                const paConfig =
                    typeof finalConfig['proactive-engagement'] === 'string'
                        ? finalConfig['proactive-engagement']
                        : JSON.stringify(finalConfig['proactive-engagement']);

                widgetElement.setAttribute('proactive-engagement', paConfig);
            }
            console.log("final config = ", finalConfig)
        }

        window.initSpotinfoWidget = function (configFromFlutter) {
            console.log("=== initSpotinfoWidget called ===");
            console.log("configFromFlutter", configFromFlutter);

            Object.assign(window.spotinfoConfigFromFlutter, configFromFlutter);

            console.log(
                "mergedConfig",
                window.spotinfoConfigFromFlutter
            );

            var widget = document.querySelector('spotinfo-chat');

            console.log("widget found?", !!widget);

            if (widget) {
                applyConfigToWidget(
                    widget,
                    window.spotinfoConfigFromFlutter
                );
            }
        };

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.async = true;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        // This ensures your Worker's versioning and caching logic is applied.
        const umdScriptUrl = 'https://www.spotinfo.ai/js/spotinfo-widget.umd.js';

        // Local File
        // const umdScriptUrl = 'spotinfo-widget.umd.js';


        loadScript(umdScriptUrl)
            .then(() => {
                console.log('spotinfo-widget.umd.js loaded via Worker.');
                var widget = document.querySelector('spotinfo-chat');
                if (widget) {
                    applyConfigToWidget(widget, window.spotinfoConfigFromFlutter);
                }
            })
            .catch(error => console.error('Failed to load UMD script via Worker:', error));

        function startObserver() {
            var observer = new MutationObserver(function (mutations) {
                mutations.forEach(function (m) {
                    for (var i = 0; i < m.addedNodes.length; i++) {
                        var node = m.addedNodes[i];
                        if (node.nodeType === 1) {
                            if (node.tagName && node.tagName.toLowerCase() === 'spotinfo-chat') {
                                applyConfigToWidget(node, window.spotinfoConfigFromFlutter);
                            }
                            if (node.querySelectorAll) {
                                var list = node.querySelectorAll('spotinfo-chat');
                                for (var j = 0; j < list.length; j++) applyConfigToWidget(list[j], window.spotinfoConfigFromFlutter);
                            }
                        }
                    }
                });
            });
            observer.observe(document.body, { childList: true, subtree: true });
            console.log('MutationObserver started for spotinfo-chat elements.');
        }

        document.addEventListener('DOMContentLoaded', startObserver);

    </script>
    <spotinfo-chat></spotinfo-chat>

</body>

</html>
